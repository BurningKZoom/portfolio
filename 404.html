<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KZoom Portfolio has moved</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="1;url=https://kz-portfolio-phi.vercel.app/">
  <link rel="canonical" href="https://kz-portfolio-phi.vercel.app/">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b; color: #fafafa; }
    main { max-width: 36rem; padding: 2rem; }
    p { color: #b4bac5; line-height: 1.6; }
    a { color: #63b3ff; overflow-wrap: anywhere; }
    a:focus-visible { outline: 2px solid #63b3ff; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <h1>My portfolio has moved.</h1>
    <p>Taking you to the new site. If it does not open automatically, follow this link:</p>
    <a id="destination" href="https://kz-portfolio-phi.vercel.app/">Open KZoom Portfolio</a>
  </main>
  <script>
    (() => {
      const previous = new URL(window.location.href);
      let path = previous.pathname;
      if (path === '/portfolio' || path.startsWith('/portfolio/')) {
        path = path.slice('/portfolio'.length) || '/';
      }

      const target = new URL("https://kz-portfolio-phi.vercel.app");
      // The application uses hash routes; only these static files have real paths.
      const staticPaths = ['/demos/dependency-map.html', '/favicon.svg', '/icons.svg'];
      if (staticPaths.includes(path)) target.pathname = path;
      target.search = previous.search;
      target.hash = previous.hash;
      if (!target.hash && /^\/case-studies\/ai-assisted-power-bi\/?$/.test(path)) {
        target.hash = '/case-studies/ai-assisted-power-bi';
      }

      document.getElementById('destination').href = target.href;
      document.querySelector('meta[http-equiv="refresh"]').content = '1;url=' + target.href;
      window.location.replace(target.href);
    })();
  </script>
</body>
</html>
